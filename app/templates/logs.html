<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Logs for {{ container.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-4xl mx-auto bg-white p-6 shadow rounded">
  <h1 class="text-xl font-bold mb-4">Logs for {{ container.name }}</h1>
  <pre class="bg-black text-green-400 p-4 rounded overflow-x-auto text-sm whitespace-pre-wrap">{{ logs }}</pre>
  <div class="pt-4">
    <a href="/stacks" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">← Back</a>
  </div>
</div>
</body>
</html>
