<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Run New Container</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-lg mx-auto bg-white p-6 shadow rounded">
    <h1 class="text-2xl font-bold mb-4">Run New Container</h1>

    {% if error %}
    <div class="bg-red-100 text-red-700 border border-red-400 px-4 py-2 rounded mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/stacks/run" class="space-y-4">
      <div>
        <label class="block mb-1 font-medium">Image</label>
        <input name="image" required
               class="w-full border rounded px-2 py-1"
               placeholder="nginx:latest"
               value="{{ form_data.get('image', '') }}"/>
      </div>
      <div>
        <label class="block mb-1 font-medium">Name</label>
        <input name="name" required
               class="w-full border rounded px-2 py-1"
               placeholder="my-nginx"
               value="{{ form_data.get('name', '') }}"/>
      </div>
      <div>
        <label class="block mb-1 font-medium">Memory Limit</label>
        <input name="mem_limit"
               class="w-full border rounded px-2 py-1"
               value="{{ form_data.get('mem_limit', '512m') }}"/>
      </div>
      <div>
        <label class="block mb-1 font-medium">CPU Quota</label>
        <input name="cpu_quota" type="number"
               class="w-full border rounded px-2 py-1"
               value="{{ form_data.get('cpu_quota', '50000') }}"/>
      </div>
      <div>
        <label class="block mb-1 font-medium">Environment Variables <span class="text-sm text-gray-600">(KEY=VALUE, comma separated)</span></label>
        <input name="envs"
               class="w-full border rounded px-2 py-1"
               placeholder="FOO=bar,DEBUG=1"
               value="{{ form_data.get('envs', '') }}"/>
      </div>
      <div>
        <label class="block mb-1 font-medium">Ports <span class="text-sm text-gray-600">(host:container)</span></label>
        <input name="ports"
               class="w-full border rounded px-2 py-1"
               placeholder="8080:80,8443:443"
               value="{{ form_data.get('ports', '') }}"/>
        <p class="mt-1 text-sm text-gray-600">
          Used ports: {{ used_ports | join(", ") }}
        </p>
      </div>
      <div>
        <label class="block mb-1 font-medium">Volumes <span class="text-sm text-gray-600">(host:container[:mode])</span></label>
        <input id="volumes-input" name="volumes"
               class="w-full border rounded px-2 py-1"
               placeholder="logs:/var/log:ro"
               value="{{ form_data.get('volumes', '') }}"/>
        <button type="button" onclick="openBrowser()"
                class="mt-1 text-blue-600 hover:underline">
          Browse files…
        </button>
      </div>
      <div class="flex space-x-2 pt-4">
        <button type="submit"
                class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
          Run
        </button>
        <a href="/stacks"
           class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
          Cancel
        </a>
      </div>
    </form>
  </div>

  <script>
    function openBrowser() {
      window.open('/stacks/fs', 'FileBrowser', 'width=600,height=400');
    }
    window.addEventListener('message', e => {
      const path = e.data;
      const inp = document.getElementById('volumes-input');
      inp.value = inp.value ? inp.value + ',' + path : path;
    }, false);
  </script>
</body>
</html>
