<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Stack</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-3xl mx-auto bg-white p-6 shadow rounded space-y-6">
    <h1 class="text-2xl font-bold text-indigo-700">Edit & Redeploy Stack: {{ stack_id }}</h1>

    {% if error %}
      <div class="p-3 bg-red-100 text-red-800 rounded">
        {{ error }}
      </div>
    {% endif %}

    <form action="/stacks/stacks/{{ stack_id }}/redeploy" method="post">
      <textarea name="compose_text" rows="18"
                class="w-full border font-mono text-sm px-2 py-1 rounded"
                placeholder="docker-compose content...">{{ compose_text }}</textarea>

      <div class="flex justify-between items-center mt-4">
        <a href="/stacks" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">Cancel</a>
        <button type="submit"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
                onclick="return confirm('Are you sure you want to redeploy this stack? This will recreate all containers.')">
          Redeploy Stack
        </button>
      </div>
    </form>
  </div>
</body>
</html>
