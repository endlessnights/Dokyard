<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>File Browser</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-md mx-auto bg-white p-4 shadow rounded">
    <h2 class="text-lg font-bold mb-2">Browsing: /{{ current or '' }}</h2>
    <ul class="list-disc pl-5">
      {% for e in entries %}
        {% set next_path = e.name if not current else current ~ '/' ~ e.name %}
        <li class="py-1">
          {% if e.is_dir %}
            <a href="?path={{ next_path|urlencode }}"
               class="text-blue-600 hover:underline">{{ e.name }}/</a>
          {% else %}
            <a href="#"
               onclick="select('{{ next_path }}')"
               class="text-green-600 hover:underline">{{ e.name }}</a>
          {% endif %}
        </li>
      {% endfor %}
    </ul>
  </div>

  <script>
    function select(path) {
      // отправляем браузеру заполнять поле volumes
      window.opener.postMessage(path, "*");
      window.close();
    }
  </script>
</body>
</html>
