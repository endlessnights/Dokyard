version: "3.8"

services:
  api:
    build: .
    container_name: aktau_guide_app
    ports:
      - '8000:8000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/clubdocker:/home/clubdocker
    env_file:
      - .env
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - pgdb
#    networks:
#      - caddy_net

  pgdb:
    image: postgres:16
    container_name: aktau_guide_db
    ports:
      - '5432:5432'
    volumes:
      - ./psql_data/:/var/lib/postgresql/data/
    env_file:
      - .env
    restart: always
